name: Alert Check Scheduler

on:
  schedule:
    - cron: "*/1 * * * *"  # every minute
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service and trigger check_alerts
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 120 https://${{ vars.RENDER_API_URL }}/health
          echo
          curl -sS --fail-with-body --max-time 180 -X POST https://${{ vars.RENDER_API_URL }}/debug/trigger
          echo

      - name: Verify checker freshness
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 60 https://${{ vars.RENDER_API_URL }}/debug/prices
          echo
