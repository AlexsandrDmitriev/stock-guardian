<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Guardian</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Stock Guardian</h1>
      <div class="status">
        <span id="wsIndicator" class="indicator offline"></span>
        <span id="wsStatus">WebSocket: offline</span>
      </div>
    </header>

    <section class="card">
      <h2>Create Alert</h2>
      <form id="alertForm">
        <div class="field">
          <label for="symbol">Symbol</label>
          <input type="text" id="symbol" placeholder="NVDA" required />
        </div>
        <div class="field">
          <label for="targetPrice">Target Price</label>
          <input type="number" id="targetPrice" step="0.01" min="0" required />
        </div>
        <div class="field">
          <label for="direction">Direction</label>
          <select id="direction">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
        </div>
        <div class="field">
          <label for="userId">User ID</label>
          <input type="text" id="userId" placeholder="12345678-1234-5678-1234-567812345678" required />
        </div>
        <button type="submit">Create</button>
      </form>
      <div id="formMessage" class="message"></div>
    </section>

    <section class="card">
      <h2>Active Alerts</h2>
      <table id="alertsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Symbol</th>
            <th>Target</th>
            <th>Direction</th>
            <th>User</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Live Notifications</h2>
      <ul id="notifications"></ul>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
