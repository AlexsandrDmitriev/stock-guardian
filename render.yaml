services:
  # Web service: FastAPI API + frontend
  # Uses Render Free tier (sleep after 15 min idle — fine for demo)
  - type: web
    name: stock-guardian-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: BROKER_URL
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: RESULT_BACKEND
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

  # Redis (Key Value) instance
  - type: keyvalue
    name: stock-guardian-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow-all

databases:
  # PostgreSQL database
  - name: stock-guardian-db
    plan: free