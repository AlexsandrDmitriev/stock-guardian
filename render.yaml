services:
  # Web service: FastAPI API + frontend
  - type: web
    name: stock-guardian-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: BROKER_URL
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: RESULT_BACKEND
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

  # Cron job: periodic alert checking (runs check_alerts every minute)
  # NOTE: Celery does NOT run as a separate worker on Render free tier.
  # The cron job calls check_alerts() directly — no broker needed at runtime.
  - type: cron
    name: stock-guardian-cron
    runtime: docker
    plan: free
    schedule: "*/1 * * * *"
    startCommand: python scripts/run_check.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock-guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: stock-guardian-redis
          type: keyvalue
          property: connectionString

  # Redis (Key Value) instance
  - type: keyvalue
    name: stock-guardian-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow-all

databases:
  # PostgreSQL database
  - name: stock-guardian-db
    plan: free